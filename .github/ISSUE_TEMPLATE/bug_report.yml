name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the steps, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Selected e-reader and format
      placeholder: Xteink X4, BMP 24-bit
  - type: input
    id: browser
    attributes:
      label: Browser version and OS
      placeholder: Firefox 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Input file, if relevant
      description: Include the file format and, for an image, its dimensions. Attach only files you can share publicly.
