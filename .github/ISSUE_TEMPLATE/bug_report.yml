name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the steps, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Selected e-reader and format
      placeholder: Xteink X4, BMP 24-bit
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Input image
      description: Size and format of the image. Attach it only if you are comfortable sharing it publicly.
